# Hardened docker-compose.yml: loopback-only binding, non-root user, read-only rootfs, dropped capabilities.
services:
  qrshield:
    build:
      context: .
      dockerfile: Dockerfile
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
    environment:
      QRSHIELD_ENV: production
      LOAD_SYNTHETIC_REFERENCE: "false"
      THREAT_INTEL_ENABLED: "false"
    volumes:
      - ./artifacts:/app/artifacts
    restart: "no"
